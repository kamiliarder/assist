# Copy to ~/.config/desk-ai/config.toml. Everything here is optional.
# Environment variables (NVIDIA_MODEL, NVIDIA_BASE_URL, NVIDIA_FALLBACK_MODELS, NVIDIA_API_KEY)
# override this file.

# --- provider ---
# base_url = "https://integrate.api.nvidia.com/v1"
# model = "nvidia/nemotron-3.5-super-vl-120b-a12b"
# fallback_models = ["meta/llama-3.3-70b-instruct"]   # tried in order if the main model keeps failing
# api_key_file = "~/.config/desk-ai/api_key"          # the key itself never goes in this file

# --- generation ---
# temperature = 0.4
# max_tokens = 1024
# extra_system_prompt = "Address me as qmil. Prefer short answers."

# --- behaviour ---
# max_attempts = 4         # retries per model for 429/5xx/network errors
# max_tool_rounds = 5
# command_timeout = 30     # seconds, run_command
# approval_timeout = 120   # seconds to wait for Allow/Deny

# --- window ---
# window_width = 460
# window_height = 600
